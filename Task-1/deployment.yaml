apiVersion: apps/v1
kind: Deployment
metadata:
  name: mena-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mena-web
  template:
    metadata:
      labels:
        app: mena-web
    spec:
      shareProcessNamespace: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: mena-web
      initContainers:
        - name: init-done
          image: busybox:1.36
          command: ["sh", "-c", "echo done; exit 0"]
      containers:
        - name: nginx
          image: nginx:1.25
          command: ["sh", "-c"]
          args:
            - |
              echo "MENA COMMUNITY : $(date '+%Y-%m-%d %H:%M:%S')" > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
        - name: time-updater
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                PID=$(ps | grep 'nginx: master' | grep -v grep | awk '{print $1}' | head -n1)
                if [ -n "$PID" ]; then
                  echo "MENA COMMUNITY : $(date '+%Y-%m-%d %H:%M:%S')" > /proc/$PID/root/usr/share/nginx/html/index.html
                fi
                sleep 5
              done
---
apiVersion: v1
kind: Service
metadata:
  name: mena-web
spec:
  type: NodePort
  selector:
    app: mena-web
  ports:
    - port: 80
      targetPort: 80